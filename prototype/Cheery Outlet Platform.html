<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cheery Outlet Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: dark lacquer header with JA² gold, role switcher, each role shown on its real device; host = time grid of seats */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#EDEBE5; --ink:#1D1C19; --ink-2:#5E5A51; --line:#DDD9CF;
  --gold:#9C7E2C; --gold-hi:#D4B85E; --gold-wash:#F4EDD8; --head:#16150F; --head-ink:#EDE6D2; --frame:#22211C;
  --booked:#3767A8; --booked-w:#E3ECF8; --seated:#B07A12; --seated-w:#F8EBCF; --done:#8C887E; --done-w:#ECEAE4;
  --alert:#B83A26; --alert-w:#F9E2DC; --ok:#2C8255; --ok-w:#DDF0E5; --counter:#6B4FA0; --counter-w:#ECE5F6;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11110E; --surface:#1B1A16; --surface-2:#25241F; --ink:#ECE8DE; --ink-2:#A39E92; --line:#35332C;
  --gold:#D4B85E; --gold-wash:#2D2715; --frame:#000; --head:#0B0B08;
  --booked:#7FA8E6; --booked-w:#1C2738; --seated:#E2B04E; --seated-w:#33280F; --done:#8C887E; --done-w:#26251F;
  --alert:#F0826C; --alert-w:#3A1D17; --ok:#6CC795; --ok-w:#15301F; --counter:#B79BE8; --counter-w:#2A2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11110E; --surface:#1B1A16; --surface-2:#25241F; --ink:#ECE8DE; --ink-2:#A39E92; --line:#35332C;
  --gold:#D4B85E; --gold-wash:#2D2715; --frame:#000; --head:#0B0B08;
  --booked:#7FA8E6; --booked-w:#1C2738; --seated:#E2B04E; --seated-w:#33280F; --done:#8C887E; --done-w:#26251F;
  --alert:#F0826C; --alert-w:#3A1D17; --ok:#6CC795; --ok-w:#15301F; --counter:#B79BE8; --counter-w:#2A2238; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hrow{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark img{width:38px;height:38px}
.brandmark b{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em;color:var(--gold-hi)}
.brandmark small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9d977f}
.hsel{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.pill{border:1px solid #3b392f;border-radius:999px;padding:6px 12px;font-size:13px;color:#cfc8b2}
.pill.on{background:var(--gold-hi);color:#16150F;border-color:var(--gold-hi);font-weight:600}
.clock{font-family:var(--mono);font-size:13px;color:var(--gold-hi);padding:6px 10px;border:1px solid #3b392f;border-radius:8px}
.roles{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
.roles::-webkit-scrollbar{display:none}
.role{padding:10px 14px 12px;font-size:14px;color:#a8a28c;border-bottom:2px solid transparent;white-space:nowrap;position:relative}
.role.on{color:#fff;border-bottom-color:var(--gold-hi)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:700}

/* demo bar */
.demo{background:var(--surface);border-bottom:1px solid var(--line)}
.demo .in{display:flex;align-items:center;gap:8px;padding-block:8px;overflow-x:auto}
.demo .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.step{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.step i{font-style:normal;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);font-size:11px;font-weight:700}
.step.done{color:var(--ok);border-color:transparent;background:var(--ok-w)}
.step.done i{background:var(--ok);color:#fff}
.step.next{border-color:var(--gold);color:var(--ink);font-weight:600;background:var(--gold-wash)}
.step.next i{background:var(--gold);color:#fff}
.tbtn{white-space:nowrap;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.tbtn.gold{background:var(--gold-hi);border-color:var(--gold-hi);color:#16150F;font-weight:600}

main{padding-block:20px 60px}
.stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.note{max-width:300px;min-width:0}
.note h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px;text-wrap:balance}
.note p{color:var(--ink-2);margin:0 0 12px}
.note ul{margin:0;padding-left:18px;color:var(--ink-2)}
.note li{margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px}

/* devices */
.phone{width:390px;max-width:100%;height:800px;border:10px solid var(--frame);border-radius:42px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.phone .scr{flex:1;overflow-y:auto;min-height:0}
.tablet{width:100%;max-width:1280px;border:12px solid var(--frame);border-radius:28px;background:var(--surface);overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.screen{width:100%;max-width:1280px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (max-width:640px){.phone{border-width:0;border-radius:14px;height:auto;min-height:640px}.phone .scr{overflow:visible}.tablet{border-width:0;border-radius:12px}}

/* common bits */
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h3{margin:0;font-size:16px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.gold{background:var(--gold-hi);color:#16150F;border-color:var(--gold-hi)}
.btn.warn{background:var(--alert);color:#fff;border-color:var(--alert)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:15px 18px;font-size:16px;border-radius:14px;width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.al{background:var(--alert-w);color:var(--alert);font-weight:600}
.chip.kid{background:var(--booked-w);color:var(--booked)}
.chip.req{background:var(--gold-wash);color:var(--gold)}
.chip.ok{background:var(--ok-w);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.pick.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:500;z-index:50;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.muted{color:var(--ink-2)}
.sec{padding:16px}
.sec h4{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

/* guest */
.ghead{padding:22px 18px 16px;background:var(--head);color:var(--head-ink)}
.ghead .t{font-family:var(--display);font-size:24px;color:var(--gold-hi)}
.ghead .s{font-size:13px;color:#a8a28c}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:9px 4px;border-radius:12px;border:1px solid var(--line);text-align:center;background:var(--surface)}
.slot b{display:block;font-family:var(--mono);font-size:14px}
.slot small{font-size:11px;color:var(--ok)}
.slot.low small{color:var(--seated)}
.slot.full{opacity:.45;cursor:not-allowed}
.slot.full small{color:var(--ink-2)}
.slot.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.slot.on small{color:var(--gold-hi)}
.hold{margin-top:12px;padding:12px;border-radius:12px;background:var(--gold-wash);font-size:13px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:44px;font-size:20px}
.stepper span{min-width:64px;text-align:center;font-weight:700;font-size:16px}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow .nm{font-weight:600}
.mrow .ds{font-size:12px;color:var(--ink-2)}
.addb{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:18px;flex:none}
.sticky{position:sticky;bottom:0;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:13px;background:var(--surface-2);color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:var(--surface)}
.sum{display:flex;justify-content:space-between;padding:4px 0}

/* host timeline */
.alerts{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface)}
.alert{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:10px;background:var(--alert-w);color:var(--alert);font-size:13px;flex-wrap:wrap}
.alert b{font-weight:700}
.alert .btn{border-color:transparent}
.tlwrap{overflow-x:auto;position:relative}
.tl{position:relative;min-width:max-content}
.tlrow{display:flex;height:44px;border-bottom:1px solid var(--line);position:relative}
.tlrow.area{height:28px;background:var(--surface-2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);align-items:center;padding-left:12px;position:sticky;left:0}
.rl{width:104px;flex:none;position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:600}
.rl small{font-weight:400;color:var(--ink-2);font-size:11px}
.cells{display:flex;position:relative}
.cell{width:42px;flex:none;border-right:1px dashed var(--line);height:100%}
.cell.hour{border-right-style:solid}
.cell:hover{background:var(--gold-wash)}
.tlhead{display:flex;height:30px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:4}
.tlhead .rl{font-size:11px;color:var(--ink-2);font-weight:500;text-transform:uppercase;letter-spacing:.1em}
.tlhead .cell{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:7px 0 0 3px}
.avail{display:flex;height:34px;border-bottom:2px solid var(--line)}
.avail .rl{font-size:11px;color:var(--ink-2);font-weight:500;line-height:1.1}
.avail .cell{display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;border-right:1px solid var(--surface)}
.blk{position:absolute;top:5px;height:34px;border-radius:8px;padding:3px 8px;font-size:12px;line-height:1.2;overflow:hidden;white-space:nowrap;border:1px solid transparent;text-align:left;z-index:2;display:flex;flex-direction:column;justify-content:center}
.blk b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.blk span{font-size:11px;opacity:.85;font-family:var(--mono)}
.blk.booked{background:var(--booked-w);color:var(--booked);border-color:color-mix(in srgb,var(--booked) 35%,transparent)}
.blk.seated{background:var(--seated-w);color:var(--seated);border-color:color-mix(in srgb,var(--seated) 40%,transparent)}
.blk.done{background:var(--done-w);color:var(--done)}
.blk.late{border:2px dashed var(--alert)}
.blk.new{box-shadow:0 0 0 3px var(--gold-hi)}
.blk.sel{outline:2px solid var(--ink);outline-offset:1px}
.buf{position:absolute;top:5px;height:34px;border-radius:0 8px 8px 0;background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,transparent 4px 8px);z-index:1;pointer-events:none}
.over{position:absolute;top:5px;height:34px;border-radius:0 8px 8px 0;background:repeating-linear-gradient(135deg,var(--alert) 0 5px,var(--alert-w) 5px 10px);z-index:2;pointer-events:none}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--alert);z-index:5;pointer-events:none}
.nowline::before{content:"Now";position:absolute;top:2px;left:4px;font-size:10px;font-weight:700;color:var(--alert);font-family:var(--mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block}

.drawer{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(0,0,0,.14);z-index:8;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0;font-size:17px;flex:1}
.drawer .db{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500}
.xbtn{width:32px;height:32px;border-radius:8px;font-size:18px;color:var(--ink-2)}
.restab{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.rt{padding:8px 6px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:13px}
.rt b{display:block}
.rt small{font-size:10px;color:var(--ink-2);display:block;line-height:1.2}
.rt.free{border-color:var(--ok);background:var(--ok-w)}
.rt.cur{background:var(--ink);color:var(--surface)}
.rt.cur small{color:var(--surface)}
.rt.blocked{opacity:.55;cursor:not-allowed;text-decoration:none}
.preview{padding:12px;border-radius:12px;font-size:13px}
.preview.ok{background:var(--ok-w);color:var(--ok)}
.preview.bad{background:var(--alert-w);color:var(--alert)}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:600}

/* floor */
.floor{display:grid;gap:14px;padding:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.areabox{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.areabox h5{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ftables{display:flex;flex-wrap:wrap;gap:10px}
.ft{border-radius:12px;padding:8px;min-width:64px;text-align:center;border:2px solid var(--line);background:var(--surface);font-size:12px}
.ft b{display:block;font-size:14px}
.ft.free{border-color:var(--ok)}
.ft.seated{border-color:var(--seated);background:var(--seated-w)}
.ft.soon{border-color:var(--booked);background:var(--booked-w)}
.ft.over{border-color:var(--alert);background:var(--alert-w)}
.ft.s6{min-width:110px}.ft.s2{min-width:54px}
.stool{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-size:11px;font-weight:600}
.stool.seated{border-color:var(--counter);background:var(--counter-w);color:var(--counter)}
.stool.free{border-color:var(--ok)}
.stool.soon{border-color:var(--booked);background:var(--booked-w)}
.counterbar{height:10px;border-radius:5px;background:var(--surface-2);margin-top:8px}

/* list */
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.st.booked{background:var(--booked-w);color:var(--booked)}
.st.seated{background:var(--seated-w);color:var(--seated)}
.st.done{background:var(--done-w);color:var(--done)}
.st.cancelled,.st.noshow{background:var(--alert-w);color:var(--alert)}
.scrollx{overflow-x:auto}

/* waiter */
.act{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);margin-bottom:10px;background:var(--surface)}
.act .tb{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block}
.act .tx small{color:var(--ink-2);display:block}
.act.p1 .tb{background:var(--ok-w);color:var(--ok)}
.act.p0 .tb{background:var(--alert-w);color:var(--alert)}
.act.p2 .tb{background:var(--gold-wash);color:var(--gold)}
.act.p3 .tb{background:var(--booked-w);color:var(--booked)}

/* kitchen */
.kds{background:#141310;color:#EDE8DA;border-radius:14px;overflow:hidden;width:100%;max-width:1280px;border:10px solid var(--frame)}
.kds .bar{border-color:#2c2a23}
.kcols{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:12px;padding:12px;overflow-x:auto}
.kcol h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9d977f;display:flex;justify-content:space-between}
.tk{background:#201f1a;border-radius:12px;margin-bottom:10px;overflow:hidden;width:100%;text-align:left;color:inherit;border:1px solid #2c2a23}
.tk .th{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-weight:700}
.tk .th.g{background:#1d3b2a}.tk .th.a{background:#4a3710}.tk .th.r{background:#5a2018}
.tk ul{list-style:none;margin:0;padding:8px 12px 10px}
.tk li{padding:3px 0;font-size:15px}
.tk li em{display:block;font-style:normal;color:#ff9b85;font-size:12px;font-weight:600}
.tk .tf{padding:8px 12px;border-top:1px solid #2c2a23;font-size:12px;color:#9d977f}
.kds .seg{background:#25241e}.kds .seg button{color:#9d977f}.kds .seg button.on{background:#3a382f;color:#fff}

/* manager */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px}
.kpi{padding:14px;border:1px solid var(--line);border-radius:12px}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-family:var(--display);font-size:30px;line-height:1.1;margin-top:4px}
.kpi .d{font-size:12px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding:0 16px 16px}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h4{margin:0 0 12px;font-size:14px}
.rule{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rule .rn{flex:1;min-width:160px}
.rule .rn b{display:block;font-weight:600}
.rule .rn small{color:var(--ink-2)}
.mini{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.mini button{width:30px;height:30px}
.mini span{min-width:70px;text-align:center;font-family:var(--mono);font-size:13px}
.tgl{width:44px;height:26px;border-radius:13px;background:var(--surface-2);position:relative;border:1px solid var(--line)}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.tgl.on{background:var(--ok)}.tgl.on::after{left:20px;background:#fff}
.req{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.req .ck{width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.req .rq{flex:1;min-width:0}
.req .rq b{display:block}
.req .rq small{color:var(--ink-2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;width:640px;max-width:100%;max-height:calc(100vh - 32px);overflow-y:auto}
.org{display:grid;gap:12px}
.brandcard{border:1px solid var(--line);border-radius:12px;padding:14px}
.brandcard h5{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:20px}
/* branch picker, qty, master data */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hsel select{width:auto;max-width:260px;background:#22211c;color:var(--head-ink);border-color:#3b392f;padding:6px 10px;font-size:13px}
a{color:var(--gold)}
.ghrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gchg{color:var(--gold-hi);font-size:13px;font-weight:600;border:1px solid #3b392f;border-radius:999px;padding:4px 12px}
.again{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:14px;background:var(--gold-wash);text-align:left;gap:10px}
.again small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.again b{font-weight:600}
.locrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.partyrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.bmain{display:block;width:100%;text-align:left;padding:12px 14px}
.bt{display:flex;align-items:center;gap:8px;justify-content:space-between}
.bt b{font-family:var(--display);font-weight:400;font-size:21px}
.bs{font-weight:600;font-size:14px}
.ba{font-size:12px;color:var(--ink-2)}
.bo{font-size:12px;color:var(--ok);margin-top:3px;font-weight:600}
.bo.cl{color:var(--alert)}
.bnext{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.bnext>span{font-size:12px;color:var(--ink-2);margin-right:2px}
.tchip{padding:7px 10px;border-radius:10px;background:var(--ink);color:var(--surface);font-family:var(--mono);font-size:13px;font-weight:600}
.bnext a{margin-left:auto;font-size:13px;font-weight:600;text-decoration:none}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:999px;flex:none;overflow:hidden}
.qty button{width:34px;height:34px;font-size:18px;line-height:1}
.qty b{min-width:22px;text-align:center;font-family:var(--mono)}
.olist{border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.oline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.oline:last-child{border-bottom:0}
.soldout{opacity:.5}
table.list td.c,table.list th.c{text-align:center}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.gcol{display:grid;gap:12px;justify-items:center;max-width:100%}
.seg{flex-wrap:wrap}
.feat .fh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.feat .fh small{display:block;margin-top:2px;font-size:12px}
.feat .fb{margin-top:6px}
.feat.off{background:var(--bg)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:10px}
.qrc{border:1px solid #DDD9CF;border-radius:12px;padding:10px;text-align:center;display:grid;gap:4px;justify-items:center;background:#fff;color:#16150F}
.qrc small{color:#5E5A51;font-size:11px}
.qrc .btn{background:#fff;color:#16150F;border-color:#DDD9CF}
.qr{width:92px;height:92px;display:grid;place-items:center;font-size:11px}
.qr img,.qr canvas{width:92px!important;height:92px!important}
.sms{background:var(--booked-w);color:var(--ink);padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:360px;font-size:13px;line-height:1.45}
.mrowbtn{display:block;width:100%;text-align:left;padding:10px;border-radius:10px}
.mrowbtn small{display:block;color:var(--ink-2);font-size:12px}
.mrowbtn.on{background:var(--gold-wash)}
.gprof{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2)}
.hist{font-size:12px;color:var(--ink-2);padding:4px 0;border-bottom:1px dashed var(--line)}
.sugg{display:grid;gap:6px;margin-top:6px}
.sg{text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--gold-wash);font-size:13px}
.sg small{color:var(--ink-2)}
.cardbox{display:flex;justify-content:space-between;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.agree input{width:auto;margin-top:2px}
.ft.dirty,.stool.dirty{border-style:dashed;border-color:var(--ink-2);background:var(--surface-2)}
.ft.resetting,.stool.resetting{border-style:dashed;border-color:var(--gold);background:var(--gold-wash)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const ACTIVE=['booked','seated'];
const B=()=>BRANDS[S.brand];
const resOf=id=>S.res.find(r=>r.id===id);
const kindOf=(brand,id)=>(BRANDS[brand].res.find(r=>r.id===id)||{kind:'table'}).kind;
const closedOn=(b,d)=>BRANDS[b].closures.some(c=>c.day===d);
const tst=(b,id)=>RULES.reset?S.tstate[b+'|'+id]:null;
const qhash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36).slice(0,5)};
const mapsUrl=k=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(BRANDS[k].name+' '+BRANDS[k].addr);
function effEnd(r){const e=r.start+r.dur;return (r.status==='seated'&&r.day===0)?Math.max(e,now()+(now()>e?15:0)):e}
// the double-booking guard: a seat is busy from start until planned finish + reset buffer
function conflictOn(brand,id,day,s,e,except){
 return S.res.find(r=>r.brand===brand&&r.day===day&&r.id!==except&&ACTIVE.includes(r.status)&&r.tables.includes(id)&&s<effEnd(r)+RULES.buffer&&r.start<e+RULES.buffer)||null;
}
function allocate(brand,party,day,start,except,pref,online){
 const Bd=BRANDS[brand], durT=durFor(party,'table'), durC=RULES.counter;
 const blk=id=>day===0&&start<=now()+10&&tst(brand,id);
 const pool=Bd.res.filter(r=>(!online||r.online)&&!blk(r.id)).filter(r=>pref==='Any'||pref===r.area||(pref==='Counter'&&r.kind==='counter')||(pref==='Table'&&r.kind==='table'));
 const freeT=r=>!conflictOn(brand,r.id,day,start,start+durT,except);
 const singles=pool.filter(r=>r.kind==='table'&&r.seats>=party&&freeT(r)).sort((a,b)=>a.seats-b.seats);
 const counterRun=()=>{if(party>4||(pref!=='Counter'&&pref!=='Any'))return null;const cs=Bd.res.filter(r=>r.kind==='counter'&&(!online||r.online)&&!blk(r.id));for(let i=0;i+party<=cs.length;i++){const run=cs.slice(i,i+party);if(run.every(c=>!conflictOn(brand,c.id,day,start,start+durC,except)))return run.map(c=>c.id)}return null};
 if(pref==='Counter')return counterRun();
 if(singles.length&&singles[0].seats<=(party<=2?2:party+2))return [singles[0].id];
 if(party<=2){const c=counterRun();if(c)return c}
 for(const [a,b] of Bd.combos){const ra=pool.find(r=>r.id===a),rb=pool.find(r=>r.id===b);if(ra&&rb&&ra.seats+rb.seats>=party&&freeT(ra)&&freeT(rb))return [a,b]}
 if(singles.length)return [singles[0].id];
 return null;
}
function seatsFreeAt(brand,day,t){
 return BRANDS[brand].res.reduce((n,r)=>n+(S.res.some(x=>x.brand===brand&&x.day===day&&ACTIVE.includes(x.status)&&x.tables.includes(r.id)&&x.start<=t&&t<effEnd(x))?0:r.seats),0);
}
const totalSeats=brand=>BRANDS[brand].res.reduce((n,r)=>n+r.seats,0);
const isLate=r=>r.day===0&&r.status==='booked'&&now()>r.start+RULES.grace;
const isOver=r=>r.status==='seated'&&r.day===0&&now()>r.start+r.dur;
const label=r=>r.tables.length>2&&kindOf(r.brand,r.tables[0])==='counter'?r.tables[0]+'–'+r.tables[r.tables.length-1]:r.tables.join('+');
const nextOn=(r)=>{let best=null;for(const id of r.tables){for(const x of S.res){if(x.brand===r.brand&&x.day===r.day&&x.id!==r.id&&x.status==='booked'&&x.tables.includes(id)&&x.start>=r.start&&(!best||x.start<best.start))best=x}}return best};

function qtyCtl(who,id){const cart=who==='g'?S.g.cart:S.w.cart;const q=(cart.find(c=>c.m===id)||{}).q||0;const a=who==='g'?'gq':'wq';const nm=esc(M[id].name);
 return q?`<div class="qty"><button data-a="${a}" data-v="${id}|-1" aria-label="One less ${nm}">−</button><b>${q}</b><button data-a="${a}" data-v="${id}|1" aria-label="One more ${nm}">+</button></div>`:`<button class="addb" data-a="${a}" data-v="${id}|1" aria-label="Add ${nm}">+</button>`}
function qty(cart,v,mod){const[id,dl]=v.split('|');const i=cart.findIndex(x=>x.m===id);if(i<0){if(+dl>0)cart.push({m:id,q:1,mod});return}cart[i].q+= +dl;if(cart[i].q<=0)cart.splice(i,1)}

function guestEnqDone(){const e=S.enq.find(x=>x.id===S.g.enqId);if(!e)return '';return gHead('Enquiry sent')+`<div class="sec" style="display:grid;gap:12px"><div style="font-family:var(--display);font-size:24px">Thanks, ${esc(e.name.split(' ')[0])}</div><p style="margin:0">${BRANDS[e.brand].name}'s events team has your enquiry for ${e.party} guests on ${DAYS[e.day]} and will reply within 2 hours.</p><p class="muted" style="margin:0">Reference <span class="mono">EQ-${e.id.toUpperCase()}</span></p><p class="muted" style="font-size:13px;margin:0">Demo: open <b>Branch manager → Enquiries</b> to answer it.</p><button class="btn" data-a="gnew">Back to restaurants</button></div>`}
function guestWaiting(){const w=S.wait.find(x=>x.id===S.g.waitId);if(!w)return '';const pos=S.wait.filter(x=>x.brand===w.brand&&(x.status==='waiting'||x.status==='notified')&&x.added<=w.added).length;

 ${w.status!=='left'?'<button class="btn warn" data-a="gwaitleave">Leave the waitlist</button>':'<button class="btn" data-a="gnew">Back to restaurants</button>'}<p class="muted" style="font-size:13px;margin:0">Demo: switch to <b>Host → Waitlist</b> to send the text and seat them.</p></div>`}
function qrGuest(){
 const q=S.qr,br=B();
 if(!q.table)return `<div class="ghead"><div class="t">Scan to order</div><div class="s">${br.name} · ${esc(br.branch)}</div></div><div class="sec"><p class="muted" style="margin-top:0">Demo helper: pick the table whose sticker the guest scans. On a real phone the camera opens that table's page directly.</p><div class="restab">${br.res.map(t=>{const st=S.res.find(r=>r.brand===S.brand&&r.status==='seated'&&r.tables.includes(t.id));return `<button class="rt ${st?'cur':''}" data-a="qrscan" data-v="${t.id}"><b>${t.id}</b><small>${st?'Seated':'Empty'}</small></button>`}).join('')}</div></div>`;

 if(rq&&rq.status==='declined')return head+`<div class="sec"><p style="margin-top:0">Please see our host, who will find you the right table.</p><button class="btn" data-a="qrreset">OK</button></div>`;
 if(tst(S.brand,q.table))return head+`<div class="sec"><p style="margin-top:0">This table is being reset. Please see our host, or scan again in a moment.</p></div>`;
 const kind=kindOf(S.brand,q.table),c=conflictOn(S.brand,q.table,0,now(),now()+durFor(q.party,kind),null);

/* ---------- HOST ---------- */
function hostView(){
 const day=S.hostDay,br=B();
 const list=S.res.filter(r=>r.brand===S.brand&&r.day===day);
 const act=list.filter(r=>ACTIVE.includes(r.status));
 const covers=list.filter(r=>r.status!=='cancelled'&&r.status!=='noshow').reduce((n,r)=>n+r.party,0);
 const alerts=hostAlerts(list);
 if(S.hostView==='wait'&&!RULES.waitlist)S.hostView='timeline';
 const wl=S.wait.filter(w=>w.brand===S.brand&&(w.status==='waiting'||w.status==='notified')).length;
 let content=S.hostView==='timeline'?timeline(list):S.hostView==='floor'?floorView(list):S.hostView==='wait'?waitView():listView(list);
 return `<div class="tablet">
 <div class="bar"><h3>${br.name} ${esc(br.branch)} · Reservations</h3><div class="seg">${['Today','Tomorrow',DAYS[2]].map((d,i)=>`<button class="${day===i?'on':''}" data-a="hday" data-v="${i}">${d}</button>`).join('')}</div>
 <div class="seg">${[['timeline','Seating grid'],['floor','Floor now'],['list','List'],...(RULES.waitlist?[['wait','Waitlist'+(wl?' · '+wl:'')]]:[])].map(([k,n])=>`<button class="${S.hostView===k?'on':''}" data-a="hview" data-v="${k}">${n}</button>`).join('')}</div>
 <span class="grow"></span><button class="chip ${S.offline?'al':'ok'}" data-a="offline" title="Demo: simulate a Wi-Fi drop">${S.offline?'Offline · '+S.queued+' saved on tablet':'Online · synced'}</button><span class="muted" style="font-size:13px">${act.length} active · ${covers} covers</span>
 <button class="btn sm" data-a="newbook" data-v="walkin">+ Walk-in</button><button class="btn sm pri" data-a="newbook" data-v="phone">+ Booking</button></div>
 ${alerts?`<div class="alerts">${alerts}</div>`:''}
 ${content}
 ${S.drawer?drawer():''}
 </div>
 <div class="stage" style="margin-top:20px">${sideNote(['Host · tablet','One grid answers every booking question','Each row is a table or counter seat. Each block is a booking from arrival to expected finish, followed by a short reset buffer. The top strip shows how many seats are still free in every 15-minute slot.',['Tap an empty cell to take a phone booking at that time','Tap a booking to seat, move, extend, cancel or mark no-show','A table can never hold two overlapping bookings: moves and extensions into a conflict are blocked and explain why','Red stripes mean a table is running over and the next guests are at risk']])}</div>`;
}
function hostAlerts(list){
 if(S.hostDay!==0)return '';
 let h='';
 list.filter(isOver).forEach(r=>{const n=nextOn(r);const over=now()-(r.start+r.dur);h+=`<div class="alert"><span><b>${label(r)} running ${over} min over</b> · ${esc(r.name)}${n?` · next guests ${esc(n.name)} at ${fmt(n.start)}`:''}</span>${n?`<button class="btn sm" data-a="sel" data-v="${n.id}">Move next booking</button>`:''}<button class="btn sm" data-a="sel" data-v="${r.id}">Open</button></div>`});
 list.filter(isLate).forEach(r=>{h+=`<div class="alert"><span><b>${esc(r.name)} is ${now()-r.start} min late</b> · ${r.party} for ${fmt(r.start)} · ${esc(r.phone)}</span><button class="btn sm" data-a="noshow" data-v="${r.id}">Mark no-show</button><button class="btn sm" data-a="seat" data-v="${r.id}">Arrived</button></div>`});
 list.filter(r=>r.isNew).forEach(r=>{h+=`<div class="alert" style="background:var(--gold-wash);color:var(--gold)"><span><b>New online booking</b> · ${esc(r.name)}, ${r.party} at ${fmt(r.start)} · auto-allocated ${label(r)}</span><button class="btn sm" data-a="sel" data-v="${r.id}">View</button></div>`});
 S.qrReq.filter(q=>q.brand===S.brand&&q.status==='pending').forEach(q=>{h+=`<div class="alert" style="background:var(--gold-wash);color:var(--gold)"><span><b>Table ${q.table} scanned the QR</b> · ${q.party} guests want to order</span><button class="btn sm" data-a="qrok" data-v="${q.id}">Start table</button><button class="btn sm" data-a="qrno" data-v="${q.id}">Not now</button></div>`});
 return h;
}
function timeline(list){
 const br=B(),day=S.hostDay,cols=(CLOSE-OPEN)/STEP;
 const x=m=>(m-OPEN)/STEP*COLW;
 let head=`<div class="tlhead"><div class="rl">Seat</div><div class="cells">`;for(let i=0;i<cols;i++){const t=OPEN+i*STEP;head+=`<div class="cell ${(t+STEP)%60===0?'hour':''}">${t%60===0?fmt(t).replace(':00',''):''}</div>`}head+='</div></div>';
 const tot=totalSeats(S.brand);
 let av=`<div class="avail"><div class="rl">Seats free<br>of ${tot}</div><div class="cells">`;for(let i=0;i<cols;i++){const t=OPEN+i*STEP;const f=seatsFreeAt(S.brand,day,t);const p=f/tot;const bg=p<0.15?'var(--alert-w)':p<0.4?'var(--seated-w)':'var(--ok-w)';const fg=p<0.15?'var(--alert)':p<0.4?'var(--seated)':'var(--ok)';av+=`<div class="cell" style="background:${bg};color:${fg}" title="${f} seats free at ${fmt(t)}">${f}</div>`}av+='</div></div>';
 let rows='',area='';
 for(const res of br.res){
  if(res.area!==area){area=res.area;rows+=`<div class="tlrow area">${area}</div>`}
  let cells='';for(let i=0;i<cols;i++){const t=OPEN+i*STEP;cells+=`<div class="cell ${(t+STEP)%60===0?'hour':''}" data-a="cell" data-v="${res.id}|${t}" title="Book ${res.id} at ${fmt(t)}"></div>`}
  let blocks='';
  for(const r of list.filter(r=>r.tables.includes(res.id)&&(ACTIVE.includes(r.status)||r.status==='done'))){
   const end=r.status==='done'?Math.min(r.start+r.dur,r.endedAt||r.start+r.dur):r.start+r.dur;
   const late=isLate(r),over=isOver(r);
   const cls=r.status==='done'?'done':r.status==='seated'?'seated':'booked';
   blocks+=`<button class="blk ${cls} ${late?'late':''} ${r.isNew?'new':''} ${S.sel===r.id?'sel':''}" style="left:${x(r.start)}px;width:${Math.max(x(end)-x(r.start)-2,30)}px" data-a="sel" data-v="${r.id}" title="${esc(r.name)} · ${r.party} · ${fmt(r.start)}–${fmt(end)}"><b>${esc(r.name)} · ${r.party}${r.allergy.length?' ⚠':''}${r.kids?' · kids':''}</b><span>${fmt(r.start).replace(' PM','')}–${fmt(end).replace(' PM','')}</span></button>`;
   if(r.status!=='done')blocks+=`<div class="buf" style="left:${x(r.start+r.dur)}px;width:${x(r.start+r.dur+RULES.buffer)-x(r.start+r.dur)}px"></div>`;
   if(over)blocks+=`<div class="over" style="left:${x(r.start+r.dur)}px;width:${Math.max(x(now())-x(r.start+r.dur),6)}px"></div>`;
  }
  rows+=`<div class="tlrow"><div class="rl">${res.id}<small>${tst(S.brand,res.id)?'<b style="color:var(--gold)">reset</b>':res.kind==='counter'?'stool':res.seats+' seats'}</small></div><div class="cells">${cells}${blocks}</div></div>`;
 }
 const nl=day===0&&now()>=OPEN&&now()<=CLOSE?`<div class="nowline" style="left:${104+x(now())}px"></div>`:'';
 let ar='';if(RULES.pacing){ar=`<div class="avail"><div class="rl">Arriving<br>max ${RULES.paceCovers}</div><div class="cells">`;for(let i=0;i<cols;i++){const t=OPEN+i*STEP,a=arrivals(S.brand,day,t),p=a.c/RULES.paceCovers;const bg=p>1?'var(--alert-w)':p>=0.75?'var(--seated-w)':'var(--surface)';const fg=p>1?'var(--alert)':p>=0.75?'var(--seated)':'var(--ink-2)';ar+=`<div class="cell" style="background:${bg};color:${fg}" title="${a.c} guests arriving ${fmt(t)}–${fmt(t+STEP)}">${a.c||''}</div>`}ar+='</div></div>'}
 return `<div class="tlwrap"><div class="tl">${head}${av}${ar}${rows}${nl}</div></div>
 <div class="legend">${RULES.pacing?'<span>Arriving row: guests per 15 min vs the pacing limit</span>':''}<span><i class="sw" style="background:var(--booked-w);border:1px solid var(--booked)"></i>Booked</span><span><i class="sw" style="background:var(--seated-w);border:1px solid var(--seated)"></i>Seated</span><span><i class="sw" style="background:var(--done-w)"></i>Finished</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,transparent 3px 6px);border:1px solid var(--line)"></i>Reset buffer (${RULES.buffer} min)</span><span><i class="sw" style="border:2px dashed var(--alert)"></i>Late arrival</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--alert) 0 3px,var(--alert-w) 3px 6px)"></i>Running over</span><span>⚠ allergy</span></div>`;
}
function floorView(list){
 const br=B(),t=now();
 const stateOf=id=>{const s=list.find(r=>r.status==='seated'&&r.tables.includes(id));if(s)return [isOver(s)?'over':'seated',s];const b=list.filter(r=>r.status==='booked'&&r.tables.includes(id)&&r.start>=t-RULES.grace&&r.start<=t+45).sort((a,b)=>a.start-b.start)[0];if(b)return ['soon',b];const ts=tst(S.brand,id);if(ts)return [ts.s,null];return ['free',null]};
 const areas=[...new Set(br.res.map(r=>r.area))];
 return `<div class="floor">${areas.map(a=>{const rs=br.res.filter(r=>r.area===a);
  if(rs[0].kind==='counter')return `<div class="areabox"><h5>${a}</h5><div class="ftables">${rs.map(r=>{const[s,x]=stateOf(r.id);return `<button class="stool ${s==='over'?'seated':s}" data-a="${x?'sel':(s==='dirty'||s==='resetting')?'treset':'newbookat'}" data-v="${x?x.id:r.id}" title="${x?esc(x.name):'Free'}">${r.id}</button>`}).join('')}</div><div class="counterbar"></div></div>`;
  return `<div class="areabox"><h5>${a}</h5><div class="ftables">${rs.map(r=>{const[s,x]=stateOf(r.id);return `<button class="ft ${s} s${r.seats}" data-a="${x?'sel':(s==='dirty'||s==='resetting')?'treset':'newbookat'}" data-v="${x?x.id:r.id}"><b>${r.id}</b>${x?`${esc(x.name.split(' ')[0])} · ${x.party}<br><span class="mono">${s==='soon'?'arrives '+fmt(x.start).replace(' PM',''):'till '+fmt(x.start+x.dur).replace(' PM','')}</span>`:`${r.seats} seats<br><span class="muted">${s==='dirty'?'Needs reset':s==='resetting'?'Resetting':'Free'}</span>`}</button>`}).join('')}</div></div>`}).join('')}</div>
 <div class="legend"><span><i class="sw" style="border:2px solid var(--ok)"></i>Free</span><span><i class="sw" style="background:var(--booked-w)"></i>Arriving within 45 min</span><span><i class="sw" style="background:var(--seated-w)"></i>Seated</span><span><i class="sw" style="background:var(--alert-w)"></i>Over time</span>${RULES.reset?'<span><i class="sw" style="border:2px dashed var(--ink-2)"></i>Needs reset · tap when done</span>':''}</div>`;
}
function listView(list){
 const rows=[...list].sort((a,b)=>a.start-b.start);
 return `<div class="scrollx"><table class="list"><thead><tr><th>Time</th><th>Guest</th><th>Pax</th><th>Seat</th><th>Finish</th><th>Notes</th><th>Source</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr data-a="sel" data-v="${r.id}" style="cursor:pointer"><td class="mono">${fmt(r.start)}</td><td><b>${esc(r.name)}</b><br><span class="muted mono" style="font-size:12px">${esc(r.phone)}</span></td><td>${r.party}</td><td>${label(r)}</td><td class="mono">${fmt(r.start+r.dur)}</td><td><div class="chips">${noteChips(r)}</div></td><td>${r.source}</td><td><span class="st ${r.status}">${statusName[r.status]}</span>${isLate(r)?' <span class="st noshow">Late</span>':''}</td></tr>`).join('')}</tbody></table></div>`;
}
function drawer(){
 if(S.drawer==='form')return bookForm();
 const r=resOf(S.sel);if(!r)return '';
 const n=nextOn(r);
 let body=`<dl class="kv"><dt>Time</dt><dd>${DAYS[r.day]} · ${fmt(r.start)} – ${fmt(r.start+r.dur)}</dd><dt>Duration</dt><dd>${r.dur} min planned${r.status==='seated'?` · seated ${fmt(r.seatedAt)}`:''}</dd><dt>Guests</dt><dd>${r.party}</dd><dt>Seat</dt><dd>${label(r)}</dd><dt>Next on seat</dt><dd>${n?`${esc(n.name)} at ${fmt(n.start)}`:'Nothing after'}</dd><dt>Phone</dt><dd class="mono">${esc(r.phone)}</dd><dt>Source</dt><dd>${r.source}</dd>${r.card?`<dt>Card held</dt><dd>•••• 4242 · fee ${money(r.party*RULES.feePP)}</dd>`:''}${r.deposit?`<dt>Deposit</dt><dd>${money(r.deposit)} paid</dd>`:''}<dt>Status</dt><dd><span class="st ${r.status}">${statusName[r.status]}</span></dd></dl>
 ${noteChips(r)?`<div><h4 class="muted" style="font-size:12px;margin:0 0 6px">NOTES</h4><div class="chips">${noteChips(r)}</div></div>`:''}`;
 body+=guestBlock(r);
 if(ACTIVE.includes(r.status)){
  const free=B().res.map(x=>{const c=conflictOn(r.brand,x.id,r.day,r.start,r.start+r.dur,r.id);return{x,c,cur:r.tables.includes(x.id)}});
  body+=`<div><h4 class="muted" style="font-size:12px;margin:0 0 6px">MOVE TO</h4><div class="restab">${free.map(({x,c,cur})=>`<button class="rt ${cur?'cur':c?'blocked':'free'}" ${c&&!cur?'disabled':''} data-a="move" data-v="${x.id}" title="${c&&!cur?'Booked by '+esc(c.name)+' '+fmt(c.start)+'–'+fmt(c.start+c.dur):'Free for this booking'}"><b>${x.id}</b><small>${cur?'current':c?esc(c.name.split(' ')[0])+' '+fmt(c.start).replace(' PM',''):x.seats+(x.kind==='counter'?' stool':' seats')}</small></button>`).join('')}</div><p class="muted" style="font-size:12px;margin:6px 0 0">Greyed seats overlap another booking and can't be chosen.${r.party>1&&kindOf(r.brand,r.tables[0])!=='counter'?'':''}</p></div>`;
 }
 if(S.msg)body+=`<div class="preview ${S.msg[0]}">${S.msg[1]}</div>`;
 body+=histBlock(r);
 let foot='';
 if(r.status==='booked')foot=`<button class="btn gold" data-a="seat" data-v="${r.id}">Seat now</button><button class="btn" data-a="extend" data-v="${r.id}">+15 min</button><button class="btn" data-a="noshow" data-v="${r.id}">No-show</button><button class="btn warn" data-a="cancel" data-v="${r.id}">Cancel</button>`;
 else if(r.status==='seated')foot=`<button class="btn" data-a="extend" data-v="${r.id}">Extend +15 min</button><button class="btn pri" data-a="finish" data-v="${r.id}">Table finished</button>`;
 else if(r.status==='noshow'&&r.card&&RULES.noshowFee&&!r.fee)foot=`<button class="btn warn" data-a="fcharge" data-v="${r.id}">Charge ${money(r.party*RULES.feePP)} to •••• 4242</button><button class="btn" data-a="fwaive" data-v="${r.id}">Waive fee</button>`;
 else foot=`<span class="muted">This booking is ${statusName[r.status].toLowerCase()}${r.fee?' · '+r.fee:''}.</span>`;
 return `<div class="drawer"><div class="dh"><h3>${esc(r.name)}</h3><button class="xbtn" data-a="close" aria-label="Close">×</button></div><div class="db">${body}</div><div class="df">${foot}</div></div>`;
}
function paceWarn(f){const tb=OPEN+Math.floor((f.start-OPEN)/STEP)*STEP,a=arrivals(S.brand,S.hostDay,tb);let nx=null;for(let t=tb+STEP;t<=CLOSE-60;t+=STEP){if(paceOK(S.brand,S.hostDay,t,f.party)&&allocate(S.brand,f.party,S.hostDay,t,null,f.pref)){nx=t;break}}
 const st='background:var(--seated-w);color:var(--seated);margin-top:8px';
 return f.override?`<div class="preview" style="${st}">Pacing override: ${a.c+f.party} guests will arrive at ${fmt(tb)} (limit ${RULES.paceCovers}). This is logged.</div>`:`<div class="preview" style="${st}">Pacing: ${a.c} guests already arrive at ${fmt(tb)} and the limit is ${RULES.paceCovers}.<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${nx?`<button class="btn sm" data-a="falt" data-v="${nx}">Use ${fmt(nx)}</button>`:''}<button class="btn sm" data-a="fover">Book anyway</button></div></div>`}
function guestBlock(r){const p=GUESTS[r.name];if(!p)return `<div class="gprof"><b>Guest</b><span class="muted" style="font-size:13px">First visit · no history yet</span></div>`;const tv=Object.values(p.visits).reduce((a,b)=>a+b,0);
 return `<div class="gprof"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>Guest history</b><span class="chip ok">JA² Club ${p.tier}</span>${p.noshow?`<span class="chip al">${p.noshow} no-show before</span>`:''}</div><div class="muted" style="font-size:13px">${tv} visits · ${Object.entries(p.visits).map(([b,n])=>b+' '+n).join(' · ')}<br>Last visit ${p.last} · average spend ${money(p.spend/Math.max(1,tv)).replace('.00','')}</div>${p.notes.length?`<div class="chips">${p.notes.map(n=>`<span class="chip req">${esc(n)}</span>`).join('')}</div>`:''}</div>`}
function histBlock(r){const h=S.log.filter(x=>x.rid===r.id);return h.length?`<div><h4 class="muted" style="font-size:12px;margin:0 0 6px">HISTORY</h4>${h.map(x=>`<div class="hist"><span class="mono">${fmt(x.t)}</span> · ${esc(x.who)} · ${esc(x.what)}</div>`).join('')}</div>`:''}
function waitView(){
 const l=S.wait.filter(w=>w.brand===S.brand&&(w.status==='waiting'||w.status==='notified')).sort((a,b)=>a.added-b.added);
 const done=S.wait.filter(w=>w.brand===S.brand&&(w.status==='seated'||w.status==='left')).slice(-4);
 return `<div class="sec"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><b>${l.length} waiting</b><span class="muted" style="font-size:13px">"Table now" shows when a table fits them</span><span class="grow"></span><button class="btn sm pri" data-a="newbook" data-v="walkin">+ Add walk-in</button></div>
 ${l.length?`<div class="scrollx"><table class="list"><thead><tr><th>Guest</th><th>Pax</th><th>Waiting</th><th>Quoted</th><th>Table now</th><th></th></tr></thead><tbody>${l.map(w=>{const fit=fitNow(w.party);return `<tr><td><b>${esc(w.name)}</b><br><span class="mono muted" style="font-size:12px">${esc(w.phone)}</span>${w.src==='Online'?' <span class="chip">Joined online</span>':''}</td><td>${w.party}</td><td class="mono">${now()-w.added} min</td><td class="mono">${w.quote} min</td><td>${fit?`<span class="chip ok">${fit.join('+')} free</span>`:'<span class="muted">None yet</span>'}</td><td style="text-align:right;white-space:nowrap">${w.status==='notified'?`<span class="chip req">Texted ${now()-w.notified} min ago</span> `:fit?`<button class="btn sm gold" data-a="wlnotify" data-v="${w.id}">Text: table ready</button> `:''}${fit?`<button class="btn sm pri" data-a="wlseat" data-v="${w.id}">Seat</button> `:''}<button class="btn sm ghost" data-a="wlleft" data-v="${w.id}">Remove</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">Nobody waiting.</p>'}
 ${done.length?`<h4 style="margin:18px 0 6px">Recently</h4>${done.map(w=>`<div class="muted" style="font-size:13px">${esc(w.name)} · ${w.party} · ${w.status==='seated'?'seated at '+w.table:'left the list'}</div>`).join('')}`:''}</div>`;
}
function bookForm(){
 const f=S.form,br=B();
 const areas=['Any',...new Set(br.res.map(r=>r.area))];
 const alloc=f.tables||allocate(S.brand,f.party,S.hostDay,f.start,null,f.pref);
 const kind=alloc?kindOf(S.brand,alloc[0]):'table';
 const dur=f.dur||durFor(f.party,kind);
 let ok=alloc&&alloc.every(id=>!conflictOn(S.brand,id,S.hostDay,f.start,f.start+dur,null));
 const paceBad=!f.walkin&&RULES.pacing&&!paceOK(S.brand,S.hostDay,f.start,f.party);
 let prev;
 if(ok)prev=`<div class="preview ok"><b>${alloc.join(' + ')}</b> is free ${fmt(f.start)} – ${fmt(f.start+dur)}${alloc.length>1&&kind!=='counter'?' (tables joined)':''}.</div>`+(paceBad?paceWarn(f):'');
 else{let alt=null;for(let t=f.start+STEP;t<=CLOSE-60;t+=STEP){const a=allocate(S.brand,f.party,S.hostDay,t,null,f.pref);if(a){alt=[t,a];break}}
  prev=`<div class="preview bad">${f.tables?`<b>${f.tables.join('+')}</b> is already booked around ${fmt(f.start)}.`:`No seat fits ${f.party} at ${fmt(f.start)}.`} ${alt?`Next free: <b>${fmt(alt[0])}</b> at ${alt[1].join('+')}. <button class="btn sm" data-a="falt" data-v="${alt[0]}">Use ${fmt(alt[0])}</button>`:''} ${f.walkin&&RULES.waitlist?'<button class="btn sm" data-a="waitlist">Add to waitlist</button>':''}</div>`}
 const times=[];for(let t=OPEN;t<=CLOSE-60;t+=STEP)times.push(t);
 const q=(f.name||'').toLowerCase(),ph=(f.phone||'').replace(/\D/g,'');const matches=(q.length>=2||ph.length>=4)?Object.entries(GUESTS).filter(([n,p])=>n!==f.name&&((q.length>=2&&n.toLowerCase().includes(q))||(ph.length>=4&&p.phone.replace(/\D/g,'').includes(ph)))).slice(0,3):[];
 return `<div class="drawer"><div class="dh"><h3>${f.walkin?'Seat a walk-in':'New phone booking'}</h3><button class="xbtn" data-a="close" aria-label="Close">×</button></div><div class="db">
 <div class="field"><label>Guests</label><div class="stepper"><button data-a="fparty" data-v="-1" aria-label="Fewer">−</button><span>${f.party}</span><button data-a="fparty" data-v="1" aria-label="More">+</button></div></div>
 ${f.walkin?`<div class="field"><label>Time</label><b class="mono">Now · ${fmt(f.start)}</b></div>`:`<div class="field"><label for="ftime">Time</label><select id="ftime" data-in="ftime">${times.map(t=>`<option value="${t}" ${t===f.start?'selected':''}>${fmt(t)}</option>`).join('')}</select></div>`}
 <div class="field"><label>Duration</label><div class="mini"><button data-a="fdur" data-v="-15" aria-label="Shorter">−</button><span>${dur} min</span><button data-a="fdur" data-v="15" aria-label="Longer">+</button></div> <span class="muted" style="font-size:12px">Default for ${f.party} guest${f.party>1?'s':''}${kind==='counter'?' at the counter':''}</span></div>
 ${f.tables?`<div class="field"><label>Seat</label><b>${f.tables.join('+')}</b> <button class="btn sm ghost" data-a="fauto">Let system choose</button></div>`:`<div class="field"><label>Area</label><div class="chips">${areas.map(a=>`<button class="pick ${f.pref===a?'on':''}" data-a="fpref" data-v="${a}">${a}</button>`).join('')}</div></div>`}
 ${prev}
 <div class="field"><label for="fname">${f.walkin?'Name (optional)':'Name'}</label><input id="fname" data-in="fname" value="${esc(f.name)}" placeholder="Type a name or mobile to find a guest" autocomplete="off"></div><div class="field"><label for="fphone">Mobile</label><input id="fphone" data-in="fphone" value="${esc(f.phone)}" placeholder="04xx xxx xxx" autocomplete="off"></div>${matches.length?`<div class="sugg">${matches.map(([n,p])=>`<button class="sg" data-a="fpick" data-v="${esc(n)}"><b>${esc(n)}</b> <span class="chip ok">${p.tier}</span>${p.noshow?` <span class="chip al">${p.noshow} no-show</span>`:''}<br><small>${p.phone} · ${Object.values(p.visits).reduce((a,b)=>a+b,0)} visits${p.notes[0]?' · '+esc(p.notes[0]):''}</small></button>`).join('')}</div>`:''}
 <div class="field"><label>Notes</label><div class="chips">${['Gluten','Shellfish','Peanut'].map(a=>`<button class="pick ${f.allergy.includes(a)?'on':''}" data-a="fall" data-v="${a}">⚠ ${a}</button>`).join('')}<button class="pick ${f.kids?'on':''}" data-a="fkids">Children</button><button class="pick ${f.highchair?'on':''}" data-a="fhc">High chair</button><button class="pick ${f.request==='Window seat'?'on':''}" data-a="freq" data-v="Window seat">Window</button><button class="pick ${f.occasion==='Birthday'?'on':''}" data-a="focc" data-v="Birthday">Birthday</button></div></div>
 </div><div class="df"><button class="btn gold" style="flex:1" data-a="fsave" ${ok&&(!paceBad||f.override)?'':'disabled'}>${f.walkin?'Seat at '+(alloc||[]).join('+'):'Save booking'}</button></div></div>`;
}

/* ---------- WAITER ---------- */
function waiterView(){
 const br=S.brand,seat=S.res.filter(r=>r.brand===br&&r.status==='seated'),w=S.w;
 let body;
 if(w.pay){const r=resOf(w.pay),b=billOf(r);body=`<div class="bar"><button class="btn sm" data-a="wback">‹ Back</button><h3>Payment · ${label(r)}</h3></div><div class="sec">${b.lines.map(l=>`<div class="sum"><span>${l.q}× ${M[l.m].name}</span><span class="mono">${money(l.q*M[l.m].price)}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--line)"><div class="sum"><span>Weekend surcharge 10%</span><span class="mono">${money(b.sur)}</span></div>${r.deposit?`<div class="sum"><span>Deposit</span><span class="mono">−${money(r.deposit)}</span></div>`:''}<div class="sum" style="font-weight:700;font-size:18px"><span>Total</span><span class="mono">${money(b.tot)}</span></div><div class="muted" style="font-size:12px;margin-bottom:12px">Card payment via Square terminal (AU). Splits by guest or item.</div><button class="btn gold big" data-a="wpaid" data-v="${r.id}">Card paid · release table</button></div>`}
 else if(w.table){const r=resOf(w.table);const n=w.cart.reduce((a,c)=>a+c.q,0);
  body=`<div class="bar"><button class="btn sm" data-a="wback">‹ Tables</button><h3>${label(r)} · ${esc(r.name)} · ${r.party}</h3></div>${noteChips(r)?`<div class="sec" style="padding-bottom:0"><div class="chips">${noteChips(r)}</div></div>`:''}
  <div class="tabs">${CATS.map(c=>`<button class="${w.cat===c?'on':''}" data-a="wcat" data-v="${c}">${c}</button>`).join('')}</div>
  <div class="sec" style="padding-top:0">${MENU.filter(m=>m.cat===w.cat).map(m=>`<div class="mrow ${m.avail===false?'soldout':''}"><div class="grow"><div class="nm">${m.name}</div><div class="mono ds">${money(m.price)}</div></div>${m.avail===false?'<span class="st noshow">Sold out</span>':qtyCtl('w',m.id)}</div>`).join('')}</div>
  ${w.cart.length?`<div class="sec" style="padding-top:0"><h4>This order</h4><div class="olist">${w.cart.map((c,i)=>`<div class="oline"><span class="grow">${M[c.m].name}${c.mod?`<br><span class="chip al">${esc(c.mod)}</span>`:''}</span><button class="btn sm ghost" data-a="wmod" data-v="${i}">${c.mod?'Change note':'+ Note'}</button>${qtyCtl('w',c.m)}</div>`).join('')}</div></div>`:''}
  <div class="sticky"><button class="btn gold big" data-a="wsend" ${n?'':'disabled'}>Send ${n||''} to kitchen</button></div>`}
 else{
  const acts=[];
  for(const r of seat){
   const tks=S.tickets.filter(t=>t.resId===r.id);
   tks.filter(t=>t.status==='ready').forEach(t=>acts.push([1,r,`Serve · ${t.items.map(i=>i.q+'× '+M[i.m].name).join(', ')}`,'Food is ready at the pass',`<button class="btn gold" data-a="serve" data-v="${t.id}">Served</button>`]));
   if(isOver(r)){const n=nextOn(r);acts.push([0,r,`Over time by ${now()-(r.start+r.dur)} min`,n?`Next guests at ${fmt(n.start)} · offer the bill or a move to the bar`:'No one waiting for this table',`<button class="btn" data-a="wpay" data-v="${r.id}">Bill</button>`])}
   if(ord(r.id).bill)acts.push([2,r,'Bill requested',`${money(billOf(r).tot)}`,`<button class="btn gold" data-a="wpay" data-v="${r.id}">Take payment</button>`]);
   else if(!ord(r.id).lines.length)acts.push([3,r,'Take order',`Seated ${now()-r.seatedAt} min ago`,`<button class="btn pri" data-a="wtable" data-v="${r.id}">Order</button>`]);
   else if(!isOver(r)&&r.start+r.dur-now()<=15&&r.start+r.dur-now()>0)acts.push([2,r,`Finishing at ${fmt(r.start+r.dur)}`,'Offer dessert or the bill to keep the turn on time',`<button class="btn" data-a="wtable" data-v="${r.id}">Add</button>`]);
  }
  S.tickets.filter(t=>t.brand===br&&t.status==='pending').forEach(t=>{const r=resOf(t.resId);acts.push([1,r,'Approve QR order',t.items.map(i=>i.q+'× '+M[i.m].name).join(', '),`<button class="btn gold" data-a="qrapprove" data-v="${t.id}">Approve</button>`])});
  S.help.filter(h=>h.brand===br).forEach(h=>{const r=resOf(h.resId);if(r)acts.push([0,r,'Guest called for help','From the table QR · '+(now()-h.at)+' min ago',`<button class="btn gold" data-a="helpdone" data-v="${h.id}">Done</button>`])});
  if(RULES.reset)Object.entries(S.tstate).filter(([k])=>k.startsWith(br+'|')).forEach(([k,v])=>{const id=k.split('|')[1];acts.push([2,{pseudo:1,brand:br,tables:[id]},v.s==='dirty'?'Reset table':'Finish resetting',v.s==='dirty'?'Guests left '+(now()-v.at)+' min ago':'Mark ready when laid',`<button class="btn" data-a="treset" data-v="${id}">${v.s==='dirty'?'Start':'Ready'}</button>`])});
  acts.sort((a,b)=>a[0]-b[0]);
  body=`<div class="bar"><h3>Hana · ${BRANDS[br].name}</h3><span class="grow"></span><span class="muted" style="font-size:13px">${seat.length} tables</span></div><div class="sec"><h4>Do next</h4>${acts.length?acts.map(([p,r,t,s,b])=>`<div class="act p${p}"><div class="tb">${label(r)}</div><div class="tx"><b>${t}</b><small>${r.pseudo?s:esc(r.name)+' · '+r.party+' · '+s}</small></div>${b}</div>`).join(''):'<p class="muted">Nothing waiting. Nice.</p>'}
  <h4 style="margin-top:18px">All my tables</h4><div class="restab">${seat.map(r=>`<button class="rt ${isOver(r)?'blocked':''}" data-a="wtable" data-v="${r.id}"><b>${label(r)}</b><small>${esc(r.name.split(' ')[0])} · till ${fmt(r.start+r.dur).replace(' PM','')}</small></button>`).join('')}</div></div>`;
 }
 return `<div class="stage"><div class="phone"><div class="scr">${body}</div></div>${sideNote(['Waiter · phone','A to-do list, not a menu of features','The waiter sees only what needs doing, most urgent first: food ready, tables over time, bills, new tables to order.',['"Finishing soon" prompts help keep turns on schedule','Allergy tags shown before the order is taken','Notes on each line go to the kitchen in red'] ])}</div>`;
}

/* ---------- KITCHEN ---------- */
function kitchenView(){
 const st=S.k.station,tk=S.tickets.filter(t=>t.brand===S.brand);
 const show=t=>{const items=t.items.filter(i=>st==='all'||M[i.m].station===st);return items.length?{...t,items}:null};
 const col=(status,title)=>{const ts=tk.filter(t=>t.status===status).map(show).filter(Boolean).sort((a,b)=>a.fired-b.fired);return `<div class="kcol"><h4><span>${title}</span><span>${ts.length}</span></h4>${ts.map(t=>{const r=resOf(t.resId),age=now()-t.fired,c=age<8?'g':age<15?'a':'r';return `<button class="tk" data-a="bump" data-v="${t.id}"><div class="th ${status==='ready'?'g':c}"><span>${label(r)} · ${r.party} pax</span><span class="mono">${age}m</span></div><ul>${t.items.map(i=>`<li><b>${i.q}×</b> ${M[i.m].name}${i.mod?`<em>${esc(i.mod)}</em>`:''}</li>`).join('')}</ul><div class="tf">${t.by} · fired ${fmt(t.fired)} · ${status==='new'?'tap to start':status==='cooking'?'tap when ready':'waiting for pickup'}</div></button>`}).join('')}</div>`};
 const allday={};tk.filter(t=>t.status==='new'||t.status==='cooking').forEach(t=>t.items.forEach(i=>{if(st==='all'||M[i.m].station===st)allday[M[i.m].name]=(allday[M[i.m].name]||0)+i.q}));
 return `<div class="kds"><div class="bar"><h3>Kitchen · ${B().name}</h3><div class="seg">${[['all','All'],['hot','Hot'],['cold','Cold & sushi'],['bar','Bar']].map(([k,n])=>`<button class="${st===k?'on':''}" data-a="kst" data-v="${k}">${n}</button>`).join('')}</div><span class="grow"></span><span style="font-size:13px;color:#9d977f">All day: ${Object.entries(allday).map(([n,q])=>q+'× '+n).join(' · ')||'—'}</span></div>
 <div class="kcols">${col('new','New')}${col('cooking','Cooking')}${col('ready','Ready at pass')}</div></div>
 <div class="stage" style="margin-top:20px">${sideNote(['Kitchen · wall screen','Tickets age in colour','Green under 8 minutes, amber to 15, red after. One tap moves a ticket on. Each station sees only its own items.',['Allergy notes in red on the item','"Ready" pings the waiter\'s phone','All-day counts for batching'] ])}</div>`;
}

/* ---------- MANAGER ---------- */
function managerView(){
 S.seenMgr=true;
 const br=S.brand,list=S.res.filter(r=>r.brand===br&&r.day===0);
 const live=list.filter(r=>r.status!=='cancelled'&&r.status!=='noshow');
 const covers=live.reduce((n,r)=>n+r.party,0);
 const seatedNow=list.filter(r=>r.status==='seated').reduce((n,r)=>n+r.party,0);
 const ns=list.filter(r=>r.status==='noshow').length,cx=list.filter(r=>r.status==='cancelled').length;
 const rev=(br==='dashi'?3180:br==='champ'?2410:1960)+S.paid.filter(p=>p.brand===br).reduce((n,p)=>n+p.amt,0);
 const turns=(live.length/Math.max(1,BRANDS[br].res.filter(r=>r.kind==='table').length)).toFixed(1);
 const freeLater=seatsFreeAt(br,0,20*60+30);
 const ne=RULES.enquiries?S.enq.filter(e=>e.brand===br&&e.status==='new').length:0;
 const tabs=`<div class="bar"><h3>${BRANDS[br].name} · ${BRANDS[br].branch}</h3><span class="grow"></span><div class="seg">${[['tonight','Tonight'],...(RULES.enquiries?[['enq','Enquiries'+(ne?' · '+ne:'')]]:[]),['seating','Tables & seats'],['menu','Menu'],['hours','Hours & closures'],['rules','Features & rules'],['msgs','Messages'],['log','Activity']].map(([k,n])=>`<button class="${S.mgr===k?'on':''}" data-a="mgr" data-v="${k}">${n}</button>`).join('')}</div></div>`;
 let body='';
 if(S.mgr==='tonight'){
  const slots=[];for(let t=OPEN;t<CLOSE;t+=30){slots.push([t,live.filter(r=>r.start>=t&&r.start<t+30).reduce((n,r)=>n+r.party,0)])}
  const mx=Math.max(...slots.map(s=>s[1]),10);
  const W=560,H=180,bw=W/slots.length;
  const chart=`<svg viewBox="0 0 ${W} ${H+28}" style="width:100%;height:auto" role="img" aria-label="Arriving covers per half hour">${[0,0.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*H*0.9}" y2="${H-f*H*0.9}" stroke="var(--line)"/><text x="0" y="${H-f*H*0.9-3}" font-size="10" fill="var(--ink-2)">${Math.round(f*mx)}</text>`).join('')}${slots.map(([t,v],i)=>`<rect x="${i*bw+8}" y="${H-v/mx*H*0.9}" width="${bw-16}" height="${v/mx*H*0.9}" rx="4" fill="${t<=now()?'var(--gold-hi)':'var(--booked)'}" opacity="${t<=now()?1:.75}"/><text x="${i*bw+bw/2}" y="${H-v/mx*H*0.9-4}" font-size="11" text-anchor="middle" fill="var(--ink)">${v||''}</text><text x="${i*bw+bw/2}" y="${H+16}" font-size="10" text-anchor="middle" fill="var(--ink-2)">${fmt(t).replace(' PM','')}</text>`).join('')}</svg>`;
  const longest=list.filter(r=>r.status==='seated').map(r=>[r,now()-r.seatedAt]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  body=`<div class="kpis"><div class="kpi"><div class="l">Covers tonight</div><div class="v">${covers}</div><div class="d">${live.length} bookings · ${seatedNow} seated now</div></div><div class="kpi"><div class="l">Seats free at 8:30 PM</div><div class="v">${freeLater}</div><div class="d">of ${totalSeats(br)} seats</div></div><div class="kpi"><div class="l">Turns per table</div><div class="v">${turns}</div><div class="d">target 2.5 on Saturday</div></div><div class="kpi"><div class="l">Revenue so far</div><div class="v">${money(rev).replace('.00','')}</div><div class="d">incl. GST · ${S.paid.filter(p=>p.brand===br).length} paid in demo</div></div>${RULES.pacing?(()=>{let bt=OPEN,bc=0;for(let t=OPEN;t<CLOSE;t+=STEP){const a=arrivals(br,0,t).c;if(a>bc){bc=a;bt=t}}return `<div class="kpi"><div class="l">Busiest 15 minutes</div><div class="v">${bc}</div><div class="d">arriving at ${fmt(bt)} · limit ${RULES.paceCovers}</div></div>`})():''}<div class="kpi"><div class="l">No-shows · cancellations</div><div class="v">${ns} · ${cx}</div><div class="d">${list.filter(r=>r.deposit).length} groups held by deposit</div></div></div>
  <div class="grid2"><div class="panel"><h4>Arriving covers per half hour</h4>${chart}<div class="legend" style="padding:6px 0 0;border:0"><span><i class="sw" style="background:var(--gold-hi)"></i>Arrived</span><span><i class="sw" style="background:var(--booked)"></i>Still to come</span></div></div>
  <div class="panel"><h4>Tables by time seated</h4><table class="list"><tbody>${longest.map(([r,m])=>`<tr><td><b>${label(r)}</b></td><td>${esc(r.name)} · ${r.party}</td><td class="mono">${m} / ${r.dur} min</td><td>${isOver(r)?'<span class="st noshow">Over</span>':'<span class="st seated">On time</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
 } else if(S.mgr==='rules')body=settingsView();
 else if(S.mgr==='msgs')body=msgView();
 else if(S.mgr==='enq')body=enqView();
 else if(S.mgr==='log')body=logView();
 else if(S.mgr==='seating')body=seatEditor();
 else if(S.mgr==='menu')body=menuEditor();
 else body=hoursEditor();
 return `<div class="screen">${tabs}${body}</div>`;
}
function settingsView(){
 const N=(k,name,sub,unit,step)=>`<div class="rule"><div class="rn"><b>${name}</b>${sub?`<small>${sub}</small>`:''}</div><div class="mini"><button data-a="rule" data-v="${k}|-${step}" aria-label="Decrease ${name}">−</button><span>${unit==='$'?'$'+RULES[k]:RULES[k]+unit}</span><button data-a="rule" data-v="${k}|${step}" aria-label="Increase ${name}">+</button></div></div>`;
 const T=(k,name,sub)=>`<div class="rule"><div class="rn"><b>${name}</b>${sub?`<small>${sub}</small>`:''}</div><button class="tgl ${RULES[k]?'on':''}" data-a="tgl" data-v="${k}" aria-label="${name}"></button></div>`;
 const C=(k,name,opts)=>`<div class="rule"><div class="rn"><b>${name}</b></div><div class="seg">${opts.map(([v,n])=>`<button class="${RULES[k]===v?'on':''}" data-a="ropt" data-v="${k}|${v}">${n}</button>`).join('')}</div></div>`;
 const G=(k,title,sub,inner)=>`<div class="panel feat ${k&&!RULES[k]?'off':''}"><div class="fh"><div><h4 style="margin:0">${title}</h4><small class="muted">${sub}</small></div>${k?`<button class="tgl ${RULES[k]?'on':''}" data-a="tgl" data-v="${k}" aria-label="${title}"></button>`:'<span class="chip">Always on</span>'}</div>${!k||RULES[k]?`<div class="fb">${inner}</div>`:''}</div>`;
 const note=t=>`<p class="muted" style="margin:6px 0 0;font-size:13px">${t}</p>`;
 return `<div class="sec" style="padding-bottom:0"><p class="muted" style="margin:0">Switch whole features on or off, then fine-tune them. Changes apply straight away across guest, host, waiter and kitchen screens and are recorded in Activity. In the prototype these settings are shared by all branches; in the full build each branch can override them.</p></div>
 <div class="grid2" style="padding-top:12px">
 ${G(null,'Online booking','Durations, holds and limits',N('dur2','1–2 guests','',' min',15)+N('dur4','3–4 guests','',' min',15)+N('dur6','5–6 guests','',' min',15)+N('dur8','7+ guests','',' min',15)+N('counter','Counter seats','',' min',15)+N('buffer','Reset buffer','Before the next booking',' min',5)+N('grace','Hold for late guests','Then prompt for no-show',' min',5)+N('maxOnline','Largest online booking','',' guests',1)+T('counterOnline','Counter bookable online',''))}
 ${G('pacing','Pacing','Limits how many guests arrive in each 15 minutes so the kitchen and floor aren\'t flooded',N('paceCovers','Guests arriving per 15 min','Hosts can override; overrides are logged','',1)+T('paceTablesOn','Also limit tables per 15 min','Many small tables are harder on the floor')+(RULES.paceTablesOn?N('paceTables','Tables arriving per 15 min','','',1):''))}
 ${G('noshowFee','No-show protection','Card held at booking, charged only for late cancellations or no-shows',N('feeFrom','Ask for a card from','',' guests',1)+N('feePP','Fee per guest','','$',5)+N('cancelHours','Free cancellation until','hours before the booking',' h',1))}
 ${G('deposits','Deposits','Paid at booking for large groups and taken off the bill',N('depositFrom','Deposit from','',' guests',1)+N('depositPP','Deposit per guest','','$',5))}
 ${G('waitlist','Waitlist','Walk-ins join a queue and get a text when a table is ready',T('guestWaitlist','Guests can join online','From the booking page, for tonight')+N('holdMin','Time to come back after the text','',' min',5))}
 ${G('reset','Table reset status','Finished tables show "needs reset" until staff mark them ready',note('Tables waiting for a reset can\'t be given to walk-ins or QR guests.'))}
 ${G('reminders','Reminders','Texts 24 hours and 2 hours before; reply C to cancel',note('Wording per brand and language is under the Messages tab.'))}
 ${G('enquiries','Group enquiries','Groups over the online limit send an enquiry to the events team',note('Answered under the Enquiries tab.'))}
 ${G('qr','Table ordering (QR)','Guests scan the code on their table to see the menu and order',C('qrMode','What guests can do',[['view','View menu'],['confirm','Order, staff approve'],['direct','Order to kitchen']])+T('qrOpen','Staff start the table first','Stops orders from a photo of the code')+T('qrPay','Pay at the table','Guests pay on their phone')+T('qrCall','Call waiter button','')+`<div style="margin-top:10px"><button class="btn sm" data-a="qrshow">${S.qrShow?'Hide':'Show'} table QR codes</button></div>${S.qrShow?qrSheet():''}`)}
 </div>`;
}

function enqView(){

 else if(e.status==='offered')act=`<div class="preview ok" style="margin-top:10px">Offered the ${esc(e.area)} at ${fmt(hm(e.otime))} with a ${money(e.party*RULES.depositPP)} deposit. Sent by email.</div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn gold" data-a="enqaccept" data-v="${e.id}">Guest accepted · create booking</button><button class="btn" data-a="enqdecline" data-v="${e.id}">Withdraw</button></div>`;
 else if(e.status==='booked')act=`<div class="preview ok" style="margin-top:10px">Booked: ${esc(e.area)} on ${DAYS[e.day]} at ${fmt(hm(e.otime))}. <button class="btn sm" data-a="enqopen" data-v="${e.id}">Open in host grid</button></div>`;
 return `<div class="panel"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><b style="font-size:16px">${esc(e.name)}</b><span class="st ${st}">${e.status}</span><span class="grow"></span><span class="muted" style="font-size:12px">Received ${e.recv}</span></div><div class="muted" style="margin-top:4px">${e.party} guests · ${DAYS[e.day]} · around ${fmt(hm(e.time))} · ${esc(e.type)}${e.budget?' · '+esc(e.budget)+' per head':''}</div>${e.notes?`<p style="margin:8px 0 0">${esc(e.notes)}</p>`:''}<div class="mono muted" style="font-size:12px;margin-top:4px">${esc(e.phone)}</div>${act}</div>`;
